name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test:core && npm run test:ui -- --run
      - name: Build
        run: npm run build
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pip-audit ruff
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt
